    /* ============ 蓝紫主题色板 ============ */
    :root {
      --primary-500: #5848FF;
      --primary-400: #7666FF;
      --primary-300: #A98CFF;
      --primary-100: #F0EDFF;
      --blue-500: #3082F6;
      --blue-100: #E8F2FF;
      --cyan-500: #22D3EE;
      --cyan-100: #E8FBFF;
      --green-500: #10B981;
      --green-100: #E8FAF3;
      --orange-500: #F59E0B;
      --orange-100: #FFF7E6;
      --bg-primary: #F8FAFF;
      --bg-secondary: #F5F3FF;
      --bg-warm: #FFFDF8;
      --hero-dark: #21145F;
      --hero-purple: #5848FF;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-tertiary: #6B7280;
      --text-disabled: #9CA3AF;
      --card-bg: #FFFFFF;
      --card-border: #E5E7EB;
      --brand-50: var(--primary-100);
      --brand-100: #E0DBFF;
      --brand-200: #C4B5FD;
      --brand-300: var(--primary-300);
      --brand-400: var(--primary-400);
      --brand-500: var(--primary-500);
      --brand-600: #4939E8;
      --brand-700: #3929C7;
      --violet-500: #8B6CFF;
      --violet-600: #6B4EFF;
      --pink-400: #F472B6;
      --bg-page: var(--bg-primary);
      --card-shadow: 0 4px 20px -8px rgba(88, 72, 255, 0.08), 0 2px 6px rgba(17,24,39,0.04);
      --card-shadow-hover: 0 12px 32px -10px rgba(88, 72, 255, 0.2), 0 4px 12px rgba(17,24,39,0.06);
    }
    .shadow-lg { box-shadow: var(--card-shadow); }
    .overflow-hidden { overflow: hidden; }
    .overflow-y-auto { overflow-y: auto; }
    .overflow-x-auto { overflow-x: auto; }
    .hidden { display: none !important; }
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
    .w-full { width: 100%; }
    .min-w-0 { min-width: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .leading-relaxed { line-height: 1.625; }
    .relative { position: relative; }
    .pl-6 { padding-left: 1.5rem; }
    .ml-2 { margin-left: 0.5rem; }
    .gradient-indigo { background: linear-gradient(135deg, #5848FF 0%, #8B6CFF 100%); }
    .gradient-cool { background: linear-gradient(135deg, #21145F 0%, #5848FF 100%); }
    .gradient-violet { background: linear-gradient(135deg, #5848FF 0%, #8B6CFF 55%, #A98CFF 100%); }
    .gradient-blue-pink { background: linear-gradient(135deg, #3082F6 0%, #5848FF 55%, #EC4899 100%); }
    .bg-mesh {
      background:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(244, 114, 182, 0.05) 0px, transparent 50%),
        #F8FAFF;
    }

    .landing-page { min-height: 100vh; overflow: hidden; background: #fff; color: #fff; padding: clamp(1rem, 3vw, 1.75rem); }
    .landing-shell { position: relative; min-height: calc(100vh - clamp(2rem, 6vw, 3.5rem)); max-width: 1780px; margin: 0 auto; overflow: hidden; border-radius: clamp(1.25rem, 2.5vw, 2rem); background: #100b35; box-shadow: 0 28px 70px rgba(17,24,39,0.18); }
    .landing-shell::before { content: ''; position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(circle at center 38%, rgba(8,10,45,0.5) 0%, rgba(19,16,82,0.25) 38%, rgba(19,16,82,0.08) 72%), linear-gradient(180deg, rgba(8,10,45,0.12) 0%, rgba(8,10,45,0.34) 100%), url('LandingPage背景图.png'); background-size: cover; background-position: center center; animation: heroImageIn 400ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .landing-hero { position: relative; z-index: 1; min-height: calc(100vh - clamp(2rem, 6vw, 3.5rem)); display: flex; align-items: center; justify-content: center; padding: clamp(4rem, 10vh, 7rem) clamp(2rem, 6vw, 6rem); text-align: center; }
    .landing-copy-block { display: flex; flex-direction: column; align-items: center; width: min(36rem, 100%); margin: 0 auto; text-align: center; }
    .landing-title { margin: 0; color: #fff; font-size: clamp(3.75rem, 7vw, 7rem); font-weight: 700; line-height: 0.95; letter-spacing: 0; text-align: center; text-shadow: 0 12px 36px rgba(0,0,0,0.28); animation: landingTitleIn 360ms 70ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .landing-copy { margin-top: clamp(1.25rem, 2vw, 2rem); color: rgba(255,255,255,0.92); font-size: clamp(1.5rem, 2.4vw, 2.5rem); line-height: 1.2; font-weight: 400; text-shadow: 0 10px 30px rgba(0,0,0,0.28); animation: landingCopyIn 320ms 150ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .landing-actions { display: flex; flex-direction: column; align-items: stretch; gap: 1.2rem; width: min(25rem, 100%); margin: clamp(2.25rem, 4vh, 3.25rem) auto 0; animation: landingActionsIn 340ms 230ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .landing-cta, .landing-secondary { display: inline-flex; align-items: center; justify-content: center; min-height: 4.25rem; padding: 1rem 1.4rem; border-radius: 9999px; font-size: clamp(1.05rem, 1.5vw, 1.45rem); font-weight: 700; transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 220ms cubic-bezier(0.16, 1, 0.3, 1), background 220ms ease; }
    .landing-cta { background: linear-gradient(135deg, #5848FF, #7C4DFF); color: #fff; box-shadow: 0 20px 36px rgba(88,72,255,0.45); }
    .landing-cta:hover { transform: translateY(-2px); box-shadow: 0 24px 42px rgba(88,72,255,0.55); }
    .landing-secondary { border: 1.5px solid rgba(255,255,255,0.75); background: rgba(10, 10, 35, 0.12); color: #fff; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
    .landing-secondary:hover { transform: translateY(-2px); background: rgba(255,255,255,0.12); }
    .landing-trip-picker { align-self: center; width: min(26rem, 100%); margin: 1.25rem auto 0; max-width: 26rem; text-align: left; animation: landingCopyIn 320ms 300ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .landing-trip-picker-title { margin-bottom: 0.625rem; color: rgba(255,255,255,0.72); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .landing-trip-list { display: grid; gap: 0.625rem; }
    .landing-trip-card { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; width: 100%; padding: 0.8rem 0.95rem; border: 1px solid rgba(255,255,255,0.24); border-radius: 0.9rem; background: rgba(255,255,255,0.12); color: #fff; text-align: left; transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), border-color 220ms ease, background 220ms ease, box-shadow 220ms ease; }
    .landing-trip-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.18); box-shadow: 0 12px 28px rgba(5, 4, 32, 0.2); }
    .landing-trip-card strong { display: block; font-size: 0.95rem; }
    .landing-trip-card span { display: block; margin-top: 0.15rem; color: #C7D2FE; font-size: 0.72rem; }

    @media (max-width: 780px) {
      .landing-page { min-height: 100svh; overflow-y: auto; padding: 0; background: #100b35; }
      .landing-shell { min-height: 100svh; border-radius: 0; background: #100b35; box-shadow: none; }
      .landing-shell::before { content: ''; position: fixed; inset: 0; height: 100svh; background-image: linear-gradient(180deg, rgba(12,9,47,0.3) 0%, rgba(12,9,47,0.18) 42%, rgba(12,9,47,0.6) 76%, rgba(16,11,53,0.94) 100%), url('LandingPage背景图.png'); background-size: cover; background-position: center center; background-repeat: no-repeat; }
      .landing-shell::after { content: ''; position: fixed; inset: 0; height: 100svh; background: radial-gradient(circle at center 54%, rgba(16,11,53,0.02) 0%, rgba(16,11,53,0.08) 38%, rgba(16,11,53,0.34) 100%); pointer-events: none; }
      .landing-hero { position: relative; z-index: 1; min-height: 100svh; align-items: center; justify-content: center; padding: max(2rem, calc(env(safe-area-inset-top) + 1rem)) 1.25rem max(2rem, env(safe-area-inset-bottom)); text-align: center; }
      .landing-copy-block { display: flex; flex-direction: column; align-items: center; justify-content: center; width: min(32rem, 100%); margin: 0 auto; transform: none; text-align: center; }
      .landing-title { font-size: clamp(3.2rem, 14vw, 4.6rem); line-height: 0.98; text-align: center; text-shadow: 0 12px 34px rgba(0,0,0,0.42); }
      .landing-copy { margin-top: 1rem; font-size: clamp(1.25rem, 6vw, 1.7rem); text-shadow: 0 10px 28px rgba(0,0,0,0.38); }
      .landing-actions { align-items: stretch; width: min(22rem, 92vw); margin: 1.5rem auto 0; gap: 0.85rem; }
      .landing-cta, .landing-secondary { min-height: 3.75rem; padding: 0.9rem 1.15rem; font-size: 1.08rem; }
      .landing-secondary { background: rgba(255,255,255,0.06); }
      .landing-trip-picker { align-self: center; width: min(22rem, 92vw); max-width: 22rem; margin: 2rem auto 0; text-align: left; }
      .landing-trip-picker-title { margin-bottom: 0.55rem; color: rgba(255,255,255,0.78); text-align: center; }
      .landing-trip-list { max-height: none; overflow: visible; padding-right: 0; }
      .landing-trip-card { padding: 0.8rem 0.9rem; border-color: rgba(255,255,255,0.22); background: rgba(18,14,58,0.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
      .landing-trip-card strong { font-size: 0.92rem; }
    }

    /* ============ 模态框 ============ */
    .modal-overlay { position: fixed; top:0; right:0; bottom:0; left:0; background: rgba(15, 23, 42, 0.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .modal-content { background: #fff; border-radius: 1.25rem; box-shadow: 0 25px 60px -12px rgba(79, 70, 229, 0.35); width: 100%; max-width: 32rem; max-height: 85vh; overflow-y: auto; padding: 1.75rem; }

    /* ============ 导航 ============ */
    .nav-bar { background: rgba(255, 255, 255, 0.92); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(88, 72, 255, 0.12); position: sticky; top: 0; z-index: 50; box-shadow: 0 8px 24px rgba(88,72,255,0.06); }
    .app-nav-inner { min-height: 4.25rem; gap: 1rem; }
    .app-brand { flex: 0 0 auto; white-space: nowrap; }
    .app-brand-mark { width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 0.75rem; background: linear-gradient(135deg,#4f46e5,#8b5cf6); color: #fff; font-size: 1.1rem; box-shadow: 0 6px 14px rgba(79,70,229,0.25); }
    .app-brand-name { color: #111827; font-size: 1rem; font-weight: 700; }
    .app-brand-name strong { color: #4f46e5; }
    .app-nav-links { min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .app-nav-links::-webkit-scrollbar { display: none; }
    .nav-btn { padding: 0.5rem 0.875rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; color: #475569; white-space: nowrap; transition: all 0.2s ease; }
    .nav-btn:hover { background: rgba(99, 102, 241, 0.08); color: var(--brand-600); }
    .nav-btn.active { background: linear-gradient(135deg, #5848FF 0%, #8B6CFF 100%); color: #fff; box-shadow: 0 4px 12px rgba(88, 72, 255, 0.3); }
    .nav-home { padding: 0.5rem 0.875rem; border: 1px solid rgba(88,72,255,0.18); border-radius: 9999px; background: rgba(240,237,255,0.9); color: #5848FF; font-size: 0.875rem; font-weight: 600; white-space: nowrap; transition: all 0.2s ease; }
    .nav-home:hover { background: rgba(169,140,255,0.2); color: #3929C7; }

    /* ============ 按钮 ============ */
    .input { width: 100%; padding: 0.625rem 0.875rem; border: 1.5px solid #e2e8f0; border-radius: 0.625rem; font-size: 0.9375rem; background: #fff; transition: all 0.2s; color: #1e293b; }
    .input:focus { outline: none; border-color: var(--primary-400); box-shadow: 0 0 0 3px rgba(88, 72, 255, 0.12); }

    .btn-primary { padding: 0.625rem 1.25rem; background: linear-gradient(135deg, #5848FF 0%, #8B6CFF 100%); color: #fff; border-radius: 9999px; font-size: 0.9375rem; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 14px rgba(88, 72, 255, 0.35); border: none; cursor: pointer; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(88, 72, 255, 0.45); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary { padding: 0.625rem 1.25rem; color: #475569; border-radius: 9999px; font-size: 0.9375rem; font-weight: 500; background: rgba(240, 237, 255, 0.9); transition: all 0.2s; border: none; cursor: pointer; }
    .btn-secondary:hover { background: rgba(169, 140, 255, 0.2); color: var(--brand-700); }

    .btn-danger { padding: 0.625rem 1.25rem; color: #dc2626; border-radius: 9999px; font-size: 0.9375rem; font-weight: 600; background: #fef2f2; transition: all 0.2s; border: none; cursor: pointer; }
    .btn-danger:hover { background: #fee2e2; color: #b91c1c; }

    .btn-outline { padding: 0.5rem 0.875rem; border: 1.5px solid rgba(88, 72, 255, 0.25); border-radius: 9999px; font-size: 0.875rem; color: var(--brand-600); background: rgba(255, 255, 255, 0.7); transition: all 0.2s; cursor: pointer; font-weight: 500; }
    .btn-outline:hover { background: rgba(240, 237, 255, 0.9); border-color: var(--brand-400); }

    /* ============ 卡片 ============ */
    .card-wrap { transition: all 0.25s ease; }
    .card-wrap:hover { transform: translateY(-2px); }
    .card-wrap:hover .card-actions, .card-wrap:active .card-actions { opacity: 1; }
    .card-actions { opacity: 0; transition: opacity 0.2s; }
    .mod-card { background: rgba(255,255,255,0.92); border-radius: 1.25rem; border: 1px solid var(--card-border); box-shadow: var(--card-shadow); }
    .mod-card:hover { box-shadow: var(--card-shadow-hover); }

    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #a5b4fc, #c4b5fd); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes heroImageIn { from { opacity: 0; transform: scale(1.035); } to { opacity: 1; transform: scale(1); } }
    @keyframes landingTitleIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes landingCopyIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes landingActionsIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ============ 动效系统：轻量、可中断、只动 transform/opacity ============ */
    :root { --motion-ease: cubic-bezier(0.16, 1, 0.3, 1); --motion-fast: 180ms; --motion-base: 260ms; }
    .reveal-on-scroll { opacity: 0; transform: translateY(18px); transition: opacity 320ms var(--motion-ease) var(--reveal-delay, 0ms), transform 320ms var(--motion-ease) var(--reveal-delay, 0ms); }
    .reveal-on-scroll.is-visible { opacity: 1; transform: translateY(0); }
    .view-content > * { transition: opacity 260ms var(--motion-ease), transform 260ms var(--motion-ease); }

var appData = null;

];

// ============ Toast 提示 ============
var syncToastTimer = null;
function showSyncToast(msg) {
  var toast = document.getElementById('sync-toast');
  if (!toast) return;
  toast.textContent = '🔄 ' + msg;
  toast.style.display = 'block';
  toast.style.opacity = '1';
  if (syncToastTimer) clearTimeout(syncToastTimer);
  syncToastTimer = setTimeout(function() {
    toast.style.opacity = '0';
    setTimeout(function() { toast.style.display = 'none'; }, 300);
  }, 2000);
}

function cloneData(data) {
  return JSON.parse(JSON.stringify(data));
}

function createBlankTripData() {
  return {
    trip: { title: '我的出行计划', startDate: '', days: 1, cities: [], notes: '' },
    collections: [],
    customTypes: [],
    schedule: { 'day1': [] }
  };
}

function getScheduleCount(data) {
  var total = 0;
  Object.keys((data && data.schedule) || {}).forEach(function(key) {
    total += ((data.schedule || {})[key] || []).length;
  });
  return total;
}

function isEmptyTripData(data) {
  data = data || {};
  return ((data.collections || []).length === 0) && getScheduleCount(data) === 0;
}

function getUnfinishedArchivedTrips() {
  return getTripRecords().filter(function(record) {
    return record.status !== 'active' && isEmptyTripData(record.data);
  });
}

function normalizeTripData(data) {
  if (!data || !data.trip) data = createBlankTripData();
  if (!data.collections) data.collections = [];
  if (!data.customTypes) data.customTypes = [];
  if (!data.schedule) data.schedule = { 'day1': [] };
  if (!data.trip.cities) data.trip.cities = [];
  if (!data.trip.days) data.trip.days = 1;
  if (isLegacyDemoTripNote(data.trip.notes)) data.trip.notes = '';
  for (var day = 1; day <= data.trip.days; day++) {
    if (!data.schedule['day' + day]) data.schedule['day' + day] = [];
  }
  data.collections.forEach(function(collection) {
    if (!collection.formatted_address && collection.address) collection.formatted_address = collection.address;
    if (!collection.place_id) collection.place_id = '';
    if (!collection.displayNameZh) collection.displayNameZh = '';
    if (!collection.photos) collection.photos = [];
    if (!collection.typeEmoji) {
      var meta = getTypeMeta(collection);
      collection.typeEmoji = meta.emoji;
    }
    if (isLegacyDemoCollectionNote(collection.note)) {
      collection.note = '';
    }
  });
  Object.keys(data.schedule || {}).forEach(function(dayKey) {
    (data.schedule[dayKey] || []).forEach(function(item) {
      delete item.slot;
      delete item.time;
      delete item.timeHint;
    });
  });
  return data;
}

function isLegacyDemoTripNote(note) {
  return typeof note === 'string' &&
    note.indexOf('EUR') >= 0 &&
    note.indexOf('Apple Pay') >= 0 &&
    note.indexOf('Visa') >= 0 &&
    note.indexOf('离线地图') >= 0;
}

function isLegacyDemoCollectionNote(note) {
  return typeof note === 'string' &&
    note.indexOf('建议早上') >= 0 &&
    note.indexOf('8:30') >= 0 &&
    note.indexOf('第一批入场') >= 0;
}

function getTripRecordTitle(data) {
  return (data && data.trip && data.trip.title) ? data.trip.title : '未命名行程';
}

function createTripRecord(data, status) {
  data = normalizeTripData(cloneData(data || createBlankTripData()));
  var now = new Date().toISOString();
  return {
    id: uid(),
    title: getTripRecordTitle(data),
    status: status || 'archived',
    createdAt: now,
    updatedAt: now,
    data: data
  };
}

function getTripRecords() {
  return (tripLibrary && tripLibrary.trips) ? tripLibrary.trips : [];
}

function getActiveTripRecord() {
  var records = getTripRecords();
  for (var i = 0; i < records.length; i++) {
    if (records[i].id === tripLibrary.activeTripId) return records[i];
  }
  return null;
}

function getTripRecordById(id) {
  var records = getTripRecords();
  for (var i = 0; i < records.length; i++) {
    if (records[i].id === id) return records[i];
  }
  return null;
}

function setOnlyActiveTrip(id) {
  tripLibrary.activeTripId = id;
  getTripRecords().forEach(function(record) {
    record.status = record.id === id ? 'active' : 'archived';
  });
}

function saveTripLibrary() {
  try { localStorage.setItem(LIBRARY_KEY, JSON.stringify(tripLibrary)); } catch(e) {}
}

function saveLocalOnly() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(appData)); } catch(e) {}
}

function syncActiveRecordFromApp(status) {
  if (!tripLibrary) tripLibrary = { activeTripId: '', trips: [] };
  if (!appData) appData = createBlankTripData();
  appData = normalizeTripData(appData);
  var record = getActiveTripRecord();
  if (!record) {
    record = createTripRecord(appData, status || 'active');
    tripLibrary.trips.unshift(record);
    tripLibrary.activeTripId = record.id;
  } else {
    record.data = cloneData(appData);
    record.title = getTripRecordTitle(appData);
    record.updatedAt = new Date().toISOString();
    if (status) record.status = status;
  }
  if (record.status === 'active') setOnlyActiveTrip(record.id);
  return record;
}

function loadData() {
  tripLibrary = { activeTripId: '', trips: [] };
  try {
    var savedLibrary = localStorage.getItem(LIBRARY_KEY);
    if (savedLibrary) {
      tripLibrary = JSON.parse(savedLibrary);
      if (!tripLibrary || !tripLibrary.trips) tripLibrary = { activeTripId: '', trips: [] };
      tripLibrary.trips.forEach(function(record) {
        record.data = normalizeTripData(record.data);
        record.title = record.title || getTripRecordTitle(record.data);
        record.status = record.status || 'archived';
        record.createdAt = record.createdAt || new Date().toISOString();
        record.updatedAt = record.updatedAt || record.createdAt;
      });
    } else {
      var saved = localStorage.getItem(STORE_KEY);
      if (saved) {
        var legacyData = normalizeTripData(JSON.parse(saved));
        var migratedRecord = createTripRecord(legacyData, 'active');
        tripLibrary = { activeTripId: migratedRecord.id, trips: [migratedRecord] };
        saveTripLibrary();
      }
    }
  } catch(e) {
    tripLibrary = { activeTripId: '', trips: [] };
  }
  if (tripLibrary.trips.length) {

function hasValidCoord(collection) {
  if (!collection) return false;
  var lat = parseFloat(collection.lat);
  var lng = parseFloat(collection.lng);
  return isFinite(lat) && isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
}

function buildPlaceQuery(collectionLike) {
  var parts = [];
  if (collectionLike.name && parts.join(' ').indexOf(collectionLike.name) < 0) parts.push(collectionLike.name);
  if (collectionLike.city && parts.join(' ').indexOf(collectionLike.city) < 0) parts.push(collectionLike.city);
  return parts.join(', ').trim();
}

function searchPlacesWithJsonp(collectionLike) {
  var query = buildPlaceQuery(collectionLike);
  if (!query) throw new Error('缺少地点名称');
  return new Promise(function(resolve, reject) {
    var callbackName = '__tripflowGeocodeCb' + (++geocodeRequestSeq);
    var script = document.createElement('script');
    var timer = null;
    function cleanup() {
      if (timer) clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
    }
    window[callbackName] = function(result) {
      cleanup();
      if (!result || !result.length) {
        reject(new Error('没有找到匹配地点'));
        return;
      }
      var candidates = result.map(function(item) {
        var lat = parseFloat(item.lat);
        var lng = parseFloat(item.lon);
        var fallbackName = (item.display_name || query).split(',')[0].trim();
        var candidateName = fallbackName;
        if (item.namedetails) {
          candidateName = item.namedetails.name || item.namedetails.official_name || item.namedetails.local_name || fallbackName;
        }
        return {
          name: candidateName || query,
          formatted_address: item.display_name || query,
          latitude: lat,
          longitude: lng,
          place_id: String(item.place_id || ''),
          raw: item
        };
      }).filter(function(item) {
        return isFinite(item.latitude) && isFinite(item.longitude);
      });
      if (!candidates.length) {
        reject(new Error('返回的位置数据不完整'));
        return;
      }
      resolve(candidates);
    };
    script.onerror = function() {
      cleanup();
      reject(new Error('地图服务暂时不可用'));
    };
    timer = setTimeout(function() {
      cleanup();
      reject(new Error('识别超时'));
    }, 12000);
    script.src = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=zh-CN,en&addressdetails=1&namedetails=1&json_callback=' + callbackName + '&q=' + encodeURIComponent(query);
    document.head.appendChild(script);
  });
}

async function searchPlaceCandidatesFromModal(options) {
  var opts = options || {};
  var btn = document.getElementById('locate-btn');
  var collectionLike = getCollectionFormData();
  if (!collectionLike.name.trim()) {
    if (!opts.silent) alert('请先输入地点名称，例如 Colosseum 或 Louvre Museum');
    updateLocationStatus('⚠️ 请先输入地点名称', 'warn');
    return [];
  }
  try {
    if (btn) { btn.disabled = true; btn.textContent = '搜索中...'; }
    updateLocationStatus('🔎 正在搜索候选地点...', 'info');
    var candidates = await searchPlacesWithJsonp(collectionLike);
    renderPlaceCandidates(candidates);
    updateLocationStatus('📍 找到 '+candidates.length+' 个候选地点，请点选正确地点', 'info');
    return candidates;
  } catch (error) {
    renderPlaceCandidates([]);
    updateLocationStatus('⚠️ 没找到候选地点，请补充城市或换个更常见的地点名', 'warn');
    if (!opts.silent) {
      alert('暂时没找到这个地点。\n\n建议这样输入：\n1. 地点名，例如：Colosseum\n2. 如果结果不准，再补城市，例如：Colosseum + Rome\n3. 连锁店请补城市，例如：Starbucks Tokyo');
    }
    return [];
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔎 搜索候选地点'; }
  }
}

function calcDistanceRaw(la1,ln1,la2,ln2) {
  var R=6371,dLat=(la2-la1)*Math.PI/180,dLng=(ln2-ln1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function calcDistance(la1,ln1,la2,ln2) { var d=calcDistanceRaw(la1,ln1,la2,ln2); if(d<1) return Math.round(d*1000)+'m'; return d.toFixed(1)+'km'; }
function escapeHtml(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeJsString(s) { if(!s) return ''; return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function nl2br(s) { return escapeHtml(s).replace(/\n/g,'<br>'); }

function activateTrip(id) {
  var record = getTripRecordById(id);
  if (!record) return;
  markLandingSeen();
  var active = getActiveTripRecord();
  if (active && active.id !== record.id) syncActiveRecordFromApp('archived');
  appData = normalizeTripData(cloneData(record.data));
  setOnlyActiveTrip(record.id);
  record.data = cloneData(appData);
  record.title = getTripRecordTitle(appData);
  record.updatedAt = new Date().toISOString();
  saveTripLibrary();
  saveLocalOnly();
  currentView = 'overview';
  closeModal();
  render();
}

function deleteArchivedTrip(id) {
  var record = getTripRecordById(id);
  if (!record) return;
  if (record.id === tripLibrary.activeTripId) {
    alert('当前行程不能在这里删除。如需清空内容，请回到概览页使用“清空当前行程”。');
    return;
  }
  var title = record.title || getTripRecordTitle(record.data);
  if (!confirm('确定删除已归档行程“' + title + '”吗？删除后无法从旅行档案恢复。')) return;
  tripLibrary.trips = getTripRecords().filter(function(item) {
    return item.id !== id;
  });
  saveTripLibrary();
  showSyncToast('已删除归档行程');
  openTripLibraryModal();
}

function continueTrip() {
  var records = getTripRecords();
  if (!records.length) {
    startNewTrip();
    return;
  }
  var active = getActiveTripRecord() || records[0];
  activateTrip(active.id);
}

function createTripFromData(data, shouldEdit) {
  markLandingSeen();
  if (!tripLibrary) tripLibrary = { activeTripId: '', trips: [] };
  archiveCurrentTripIfNeeded();
  var record = createTripRecord(data || createBlankTripData(), 'active');
  tripLibrary.trips.unshift(record);
  setOnlyActiveTrip(record.id);
  appData = normalizeTripData(cloneData(record.data));
  saveTripLibrary();
  saveLocalOnly();
  currentView = 'overview';
  render();
  if (shouldEdit) editTrip();

function startNewTrip() {
  var warnings = [];
  var activeRecord = getActiveTripRecord();
  if (activeRecord && isEmptyTripData(activeRecord.data)) {
    warnings.push('当前行程“' + (activeRecord.title || getTripRecordTitle(activeRecord.data)) + '”还是 0 个收藏、0 个行程');
  } else if (!activeRecord && isEmptyTripData(appData)) {
    warnings.push('当前行程还是 0 个收藏、0 个行程');
  }
  var unfinished = getUnfinishedArchivedTrips();
  if (unfinished.length) {
    var names = unfinished.slice(0, 3).map(function(record) {
      return '“' + (record.title || getTripRecordTitle(record.data)) + '”';
    }).join('、');
    var extra = unfinished.length > 3 ? ' 等 ' + unfinished.length + ' 个' : '';
    warnings.push('已归档行程里还有未完成的出行计划：' + names + extra);
  }
  if (warnings.length && !confirm(warnings.join('\n') + '\n\n确定还要新建一个旅程吗？')) return;
  createTripFromData(createBlankTripData(), true);
}

function moveSchedule(id, dir) {
  var dayKey = 'day'+currentDay;
  var sched = appData.schedule[dayKey] || [];
  // 找到当前项
  var idx = -1;
  for (var i=0; i<sched.length; i++) { if (sched[i].id===id) { idx=i; break; } }
  if (idx < 0) return;
  var swapIdx = idx + dir;
  if (swapIdx < 0) return; // 已到边界
  if (swapIdx >= sched.length) return;
  // 交换
  var tmp = sched[idx];
  sched[idx] = sched[swapIdx];
  sched[swapIdx] = tmp;
  saveData(); render();
}

function startScheduleDrag(event, id) {
  scheduleDragId = id;
  if (event.dataTransfer) {
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', id);
  }
  var row = event.target.closest('.timeline-row');
  if (row) row.classList.add('dragging');
}

function endScheduleDrag(event) {
  scheduleDragId = null;
  document.querySelectorAll('.drag-over,.dragging').forEach(function(node) { node.classList.remove('drag-over', 'dragging'); });
}

function startScheduleTouch(event, id) {
  scheduleDragId = id;
  scheduleTouchDragging = true;
  var row = event.target.closest('.timeline-row');
  if (row) row.classList.add('dragging');
}

function moveScheduleTouch(event) {
  if (!scheduleTouchDragging) return;
  event.preventDefault();
  document.querySelectorAll('.drag-over').forEach(function(node) { node.classList.remove('drag-over'); });
  var touch = event.touches && event.touches[0];
  if (!touch) return;
  var target = document.elementFromPoint(touch.clientX, touch.clientY);
  if (!target) return;
  var row = target.closest('.timeline-row');
  if (row && row.getAttribute('data-schedule-id') !== scheduleDragId) {
    row.classList.add('drag-over');
  }
}

function endScheduleTouch(event) {
  if (!scheduleTouchDragging) return;
  var touch = event.changedTouches && event.changedTouches[0];
  var target = touch ? document.elementFromPoint(touch.clientX, touch.clientY) : null;
  if (target) {
    var row = target.closest('.timeline-row');
    if (row && row.getAttribute('data-schedule-id') !== scheduleDragId) {
      var rect = row.getBoundingClientRect();
      var insertAfter = touch.clientY > rect.top + rect.height / 2;
      reorderSchedule(scheduleDragId, row.getAttribute('data-schedule-id'), insertAfter);
      cancelScheduleTouch();
      return;
    }
  }
  cancelScheduleTouch();
}

function cancelScheduleTouch() {
  scheduleTouchDragging = false;
  scheduleDragId = null;
  document.querySelectorAll('.drag-over,.dragging').forEach(function(node) { node.classList.remove('drag-over', 'dragging'); });
}

function dragOverSchedule(event) {
  event.preventDefault();
  var row = event.target.closest('.timeline-row');
  if (row) row.classList.add('drag-over');
}

function dragOverSlot(event) {
  event.preventDefault();
}

function dropSchedule(event, targetId) {
  event.preventDefault();
  event.stopPropagation();
  var draggedId = scheduleDragId || (event.dataTransfer ? event.dataTransfer.getData('text/plain') : '');
  var row = event.target.closest('.timeline-row');
  var insertAfter = false;
  if (row) {
    var rect = row.getBoundingClientRect();
    insertAfter = event.clientY > rect.top + rect.height / 2;
  }
  reorderSchedule(draggedId, targetId, insertAfter);
}

function clearDragOver(event) {
  var target = event.currentTarget || event.target;
  if (target && target.classList) target.classList.remove('drag-over');
}

function reorderSchedule(draggedId, targetId, insertAfter) {
  if (!draggedId) return;
  var dayKey = 'day'+currentDay;
  var sched = appData.schedule[dayKey] || [];
  var draggedIndex = -1;
  for (var index=0; index<sched.length; index++) {
    if (sched[index].id === draggedId) { draggedIndex = index; break; }
  }
  if (draggedIndex < 0) return;
  var draggedItem = sched.splice(draggedIndex, 1)[0];
  var insertIndex = sched.length;
  if (targetId) {
    for (var targetIndex=0; targetIndex<sched.length; targetIndex++) {
      if (sched[targetIndex].id === targetId) { insertIndex = targetIndex + (insertAfter ? 1 : 0); break; }
    }
  }
  sched.splice(insertIndex, 0, draggedItem);
  saveData();
  render();
}

function getAppleMapLocationValue(collection) {
  return collection.lat + ',' + collection.lng;
}

function buildAppleDirectionsUrl(points) {
  if (!points.length) return '';
  if (points.length === 1) {
    var single = points[0].collection;
    return 'https://maps.apple.com/?ll=' + single.lat + ',' + single.lng + '&q=' + encodeURIComponent(getDisplayName(single));
  }
  var source = points[0].collection;
  var destination = points[points.length - 1].collection;
  var params = [
    'source=' + encodeURIComponent(getAppleMapLocationValue(source)),
    'destination=' + encodeURIComponent(getAppleMapLocationValue(destination)),
    'mode=' + encodeURIComponent('driving')
  ];
  points.slice(1, -1).forEach(function(point) {
    params.push('waypoint=' + encodeURIComponent(getAppleMapLocationValue(point.collection)));
  });
  return 'https://maps.apple.com/directions?' + params.join('&');
}

function openExternalMap(type) {
  var points = getDayPoints();
  if (points.length===0) { alert('今天还没有带位置的行程项'); return; }
  var url = '';
  if (type==='google') {
    if (points.length===1) {
      url = 'https://www.google.com/maps/search/?api=1&query='+points[0].collection.lat+','+points[0].collection.lng;
    } else {
      var origin = points[0].collection.lat+','+points[0].collection.lng;
      var dest = points[points.length-1].collection.lat+','+points[points.length-1].collection.lng;
      var waypoints = points.slice(1,-1).map(function(p){ return p.collection.lat+','+p.collection.lng; }).join('|');
      url = 'https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+dest+(waypoints ? '&waypoints='+waypoints : '&waypoints=')+'&travelmode=walking';
    }
  } else if (type==='apple') {
    url = buildAppleDirectionsUrl(points);
  }
  window.open(url, '_blank');
}

// 纯 SVG 离线地图
var leafletMap = null;
var mapLoadChecked = false;

function renderMap() {
  var points = getDayPoints();
  var infoEl = document.getElementById('map-route-info');
  var container = document.getElementById('map-container');

  // 清理旧地图
  if (leafletMap) {
    try { leafletMap.remove(); } catch(e) {}
    leafletMap = null;
  }

  if (points.length===0) {
    if (infoEl) infoEl.innerHTML = '<p class="text-sm text-gray-500 text-center" style="padding:1rem 0;">今天还没有带位置的行程项</p>';
    if (container) container.innerHTML = '<p class="text-center text-gray-400" style="padding:5rem 0;">暂无地图数据</p>';
    return;
  }

  var pts = points.map(function(s){ return Object.assign({}, s.collection, {customNote:s.customNote}); });
  var colorMap={amber:'#F59E0B',rose:'#EF4444',indigo:'#5848FF',blue:'#3082F6',gray:'#6B7280'};

  // 检查 Leaflet 是否加载完成
  if (typeof L === 'undefined') {
    if (container) container.innerHTML = '<div style="padding:2rem;text-align:center;"><p style="color:#9ca3af;">🗺️ 正在加载地图...</p><p style="color:#9ca3af;font-size:0.75rem;margin-top:0.5rem;">如果长时间不显示，请检查网络</p></div>';
    // 3秒后还加载不了，提示用外部地图
    setTimeout(function(){
      if (typeof L === 'undefined' && container && !leafletMap) {
        var html = '<div style="padding:1.5rem;text-align:center;">';
        html += '<div style="font-size:2.5rem;margin-bottom:0.5rem;">🗺️</div>';
        html += '<p style="color:#4b5563;font-weight:600;margin-bottom:0.25rem;">地图库加载失败</p>';
        html += '<p style="color:#9ca3af;font-size:0.8125rem;margin-bottom:1rem;">可能是网络问题，请使用下方地图按钮</p>';
        html += '<div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;">';
        html += '<button onclick="openExternalMap(\'google\')" class="btn-outline" style="padding:0.5rem 0.875rem;font-size:0.8125rem;">🌐 Google</button>';
        html += '<button onclick="openExternalMap(\'apple\')" class="btn-outline" style="padding:0.5rem 0.875rem;font-size:0.8125rem;">🍎 苹果</button>';
        html += '</div></div>';
        container.innerHTML = html;
      }
    }, 3000);
    return;
  }

  // 计算中心点和缩放范围
  var lats = pts.map(function(p){return p.lat;});
  var lngs = pts.map(function(p){return p.lng;});
  var centerLat = (Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
  var centerLng = (Math.min.apply(null,lngs)+Math.max.apply(null,lngs))/2;

  // 初始化地图
  leafletMap = L.map(container, {
    zoomControl: true,
    scrollWheelZoom: true,
    tap: true
  }).setView([centerLat, centerLng], 14);

  // 添加 OpenStreetMap 瓦片图层（中文标签）
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap 贡献者',
    maxZoom: 19,
    subdomains: 'abc'
  }).addTo(leafletMap);

  // 添加所有标记
  var latlngs = [];
  pts.forEach(function(p, idx) {
    var latlng = [p.lat, p.lng];
    latlngs.push(latlng);

    var color = colorMap[getTypeColor(p)] || '#6b7280';
    var icon = L.divIcon({
      className: 'trip-marker',
      html: '<div class="trip-marker-inner" style="background:'+color+';">'+(idx+1)+'</div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    var marker = L.marker(latlng, { icon: icon, title: getDisplayName(p) }).addTo(leafletMap);

    // 弹窗内容
    var popupHtml = '<div style="min-width:160px;">';
    popupHtml += '<div style="font-weight:700;font-size:14px;color:#111827;margin-bottom:4px;">'+getTypeIcon(p)+' '+escapeHtml(getDisplayName(p))+'</div>';
    if (p.formatted_address || p.address) popupHtml += '<div style="font-size:12px;color:#6b7280;margin-bottom:4px;">📍 '+escapeHtml(p.formatted_address || p.address)+'</div>';
    popupHtml += '<div style="font-size:12px;color:#4f46e5;font-weight:600;">第 '+(idx+1)+' 站</div>';
    if (p.customNote) popupHtml += '<div style="font-size:12px;color:#4b5563;margin-top:6px;padding:4px 8px;background:#f3f4f6;border-radius:4px;">'+escapeHtml(p.customNote)+'</div>';
    popupHtml += '</div>';
    marker.bindPopup(popupHtml);
  });

  // 连接所有点
  if (pts.length > 1) {
    L.polyline(latlngs, {
      color: '#5848FF',
      weight: 4,
      opacity: 0.85,
      dashArray: '8, 6'
    }).addTo(leafletMap);
  }

  // 自动缩放到所有点
  if (pts.length > 1) {
    leafletMap.fitBounds(L.latLngBounds(latlngs), { padding: [60, 60] });
  } else if (pts.length === 1) {
    leafletMap.setView(latlngs[0], 15);
  }

  // 路线信息面板
  var totalDist=0;
  for (var i=0;i<pts.length-1;i++){ totalDist+=calcDistanceRaw(pts[i].lat,pts[i].lng,pts[i+1].lat,pts[i+1].lng); }
  var routeList='';
  pts.forEach(function(p,idx){
    var dh = idx<pts.length-1 ? '<span class="text-xs text-gray-400 flex-shrink-0">→ '+calcDistance(p.lat,p.lng,pts[idx+1].lat,pts[idx+1].lng)+'</span>' : '';
    var color = colorMap[getTypeColor(p)] || '#6b7280';
    routeList+='<div class="flex items-center gap-3 py-2" style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0;'+(idx<pts.length-1?'border-bottom:1px solid #f3f4f6;':'')+'">';
    routeList+='<span style="width:1.5rem;height:1.5rem;background:'+color+';color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:bold;flex-shrink:0;">'+(idx+1)+'</span>';
    routeList+='<span class="text-sm pixel-route-icon">'+escapeHtml(getTypeIcon(p))+'</span>';
    routeList+='<div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-800 truncate">'+escapeHtml(getDisplayName(p))+'</p><p class="text-xs text-gray-400">第 '+(idx+1)+' 站 '+escapeHtml(p.customNote||'')+'</p></div>';
    routeList+=dh+'</div>';
  });
  if (infoEl) infoEl.innerHTML='<h3 class="font-semibold text-gray-800 mb-3">📍 第'+currentDay+'天路线 · 共'+pts.length+'个站点</h3><div class="flex items-center gap-2 mb-3 text-sm text-gray-500"><span style="padding:0.25rem 0.5rem;background:#eef2ff;color:#4f46e5;border-radius:0.25rem;">总距离约 '+totalDist.toFixed(1)+' km</span><span style="padding:0.25rem 0.5rem;background:#f9fafb;color:#4b5563;border-radius:0.25rem;">直线距离参考</span></div><div class="space-y-2">'+routeList+'</div>';

  // 强制让 Leaflet 重算尺寸（避免在隐藏容器中初始化导致的空白问题）
  setTimeout(function(){
    if (!leafletMap) return;
    try {
      var mapNode = leafletMap.getContainer();
      if (mapNode && document.body.contains(mapNode)) leafletMap.invalidateSize();
      else leafletMap = null;
    } catch (e) {
      leafletMap = null;
    }
  }, 200);
}

function buildTripArchivePayload(record) {
  return {
    archiveType: 'TripFlowTripArchive',
    version: 1,
    exportedAt: new Date().toISOString(),
    trip: {
      id: record.id,
      title: record.title,
      status: record.status,
      createdAt: record.createdAt,
      updatedAt: record.updatedAt,
      data: normalizeTripData(cloneData(record.data))
    }
  };
}

function sanitizeFilename(name) {
  return String(name || 'tripflow').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-').slice(0, 60);
}

function downloadJsonFile(filename, data) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function exportTripFile(id) {
  syncActiveRecordFromApp('active');
  var record = getTripRecordById(id);
  if (!record) return;
  var date = new Date().toISOString().slice(0, 10);
  downloadJsonFile(sanitizeFilename(record.title) + '-' + date + '.json', buildTripArchivePayload(record));
  showSyncToast('已导出完整归档文件');
}

function exportActiveTripFile() {
  syncActiveRecordFromApp('active');
  saveTripLibrary();
  saveLocalOnly();
  var active = getActiveTripRecord();
  if (active) exportTripFile(active.id);
}

function extractTripDataFromArchive(payload) {
  if (!payload) return null;
  if (payload.archiveType === 'TripFlowTripArchive' && payload.trip && payload.trip.data) return payload.trip.data;
  if (payload.data && payload.data.trip) return payload.data;
  if (payload.trip && payload.collections && payload.schedule) return payload;
  return null;
}

function importTripArchiveFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    try {
      var payload = JSON.parse(reader.result);
      var rawData = extractTripDataFromArchive(payload);
      if (!rawData) throw new Error('invalid archive');
      var data = normalizeTripData(rawData);
      if (!confirm('导入后会把这份文件设为当前行程，当前行程会自动进入旅行档案。是否继续？')) return;
      closeModal();
      createTripFromData(data, false);
      showSyncToast('已导入归档文件');
    } catch(e) {
      alert('无法识别这个 TripFlow 归档文件，请确认文件是从“导出文件”生成的 JSON。');
    }
  };
  reader.readAsText(file);
}

  if (hash.indexOf('#d=') === 0) {

    try {
      var sharedData = decompressData(compressed);

function handlePhotoUpload(event) {

      var reader = new FileReader();
      reader.onload = function(e) {
        // 压缩图片到合理大小
        compressImage(e.target.result, 800, 0.7, function(compressed) {
          window._editingPhotos.push(compressed);
          renderPhotoPreview();
        });

      reader.readAsDataURL(file);
    })(files[i]);
  }
  event.target.value = ''; // 允许重复选择同一文件
}

function compressImage(dataUrl, maxSize, quality, callback) {
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var w = img.width, h = img.height;
    if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
    else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

// ============ 智能路线规划（最近邻算法） ============
function optimizeRoute() {
  var dayKey = 'day'+currentDay;
  var items = appData.schedule[dayKey] || [];
  if (items.length < 2) { alert('至少需要2个行程项才能优化'); return; }

  // 检查有多少项有坐标
  var withCoord = [];
  var withoutCoord = [];
  var missingNames = [];
  items.forEach(function(it) {
    var col = getCollectionById(it.collectionId);
    if (hasValidCoord(col)) withCoord.push(it);
    else {
      withoutCoord.push(it);
      if (col) missingNames.push(getDisplayName(col));
    }
  });

  if (withCoord.length < 2) {
    alert('至少需要 2 个已确认地图地点的行程项才能优化路线。\n\n当前还缺位置的条目：\n' + (missingNames.length ? missingNames.join('\n') : '未识别地点') + '\n\n请编辑这些收藏，重新搜索候选地点并确认。');
    return;
  }

  // 最近邻算法：以第一个点为起点，每次找最近的未访问点
  var route = [withCoord[0]];
  var remaining = withCoord.slice(1);
  var totalDist = 0;

  while (remaining.length > 0) {
    var last = route[route.length-1];
    var lastCol = getCollectionById(last.collectionId);
    var nearestIdx = 0;
    var nearestDist = Infinity;

    for (var i=0; i<remaining.length; i++) {
      var col = getCollectionById(remaining[i].collectionId);
      var d = calcDistanceRaw(lastCol.lat, lastCol.lng, col.lat, col.lng);
      if (d < nearestDist) {
        nearestDist = d;
        nearestIdx = i;
      }
    }

    totalDist += nearestDist;
    route.push(remaining[nearestIdx]);
    remaining.splice(nearestIdx, 1);
  }

  route.forEach(function(item) {
    delete item.slot;
    delete item.time;
    delete item.timeHint;
  });

  // 没有坐标的行程项放到最后
  var newOrder = route.concat(withoutCoord);
  appData.schedule[dayKey] = newOrder;

  saveData();
  render();
  showSyncToast('已按最优路线排序，总距离约 ' + totalDist.toFixed(1) + ' km');
}

  var overlay = document.getElementById('modal-overlay');
  if (!overlay) return;
  if (modalCloseTimer) clearTimeout(modalCloseTimer);
  document.getElementById('modal-content').innerHTML = html;
  overlay.classList.remove('hidden');
  requestAnimationFrame(function() { overlay.classList.add('is-visible'); });
}
function closeModal() {
  var overlay = document.getElementById('modal-overlay');
  if (!overlay) return;
  overlay.classList.remove('is-visible');
  modalCloseTimer = setTimeout(function() {
    overlay.classList.add('hidden');
  }, 240);
  editingCollectionId = null;
  editingScheduleId = null;
  window._editingPhotos = null;
}

function switchView(view) { currentView = view; render(); if (view==='map') setTimeout(renderMap, 100); }
function switchDay(day) { currentDay = day; render(); if (currentView==='map') setTimeout(renderMap, 100); }

function setupMotion() {
  var app = document.getElementById('app');
  if (!app) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var viewRoot = app.querySelector('.nav-bar ~ .max-w-6xl, .nav-bar ~ .max-w-4xl');
  var revealNodes = [];

  if (viewRoot) {
    viewRoot.classList.add('view-content');
    Array.prototype.forEach.call(viewRoot.children, function(node) {
      if (revealNodes.indexOf(node) === -1) revealNodes.push(node);
    });
  }
  Array.prototype.forEach.call(app.querySelectorAll('.reveal-on-scroll'), function(node) {
    if (revealNodes.indexOf(node) === -1) revealNodes.push(node);
  });
  Array.prototype.forEach.call(app.querySelectorAll('.mod-card, .timeline-row, #map-container, #map-route-info'), function(node) {
    if (revealNodes.indexOf(node) === -1) revealNodes.push(node);
  });

  if (reduceMotion || !('IntersectionObserver' in window)) {
    revealNodes.forEach(function(node) { node.classList.add('is-visible'); });
    return;
  }

  var observer = new IntersectionObserver(function(entries, currentObserver) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-visible');
      currentObserver.unobserve(entry.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

  revealNodes.forEach(function(node, index) {
    node.style.setProperty('--reveal-delay', Math.min(index * 45, 180) + 'ms');
    node.classList.add('reveal-on-scroll');
    observer.observe(node);
  });
}

function render() {
  var app = document.getElementById('app');
  if (currentView === 'landing') {
    app.innerHTML = renderLanding();
    requestAnimationFrame(setupMotion);
    return;
  }
  if (currentView === 'overview') {
    app.innerHTML = '<div class="overview-shell">' + renderNav() + renderOverview() + '</div>';
    requestAnimationFrame(setupMotion);
    return;
  }
  var content = renderNav();
  if (currentView==='collections') content += renderCollections();
  else if (currentView==='timeline') content += renderTimeline();
  else if (currentView==='map') content += renderMapView();
  app.innerHTML = content;
  requestAnimationFrame(setupMotion);
}

function removeGreenBackground(img) {
  if (!img || img.dataset.chromaReady) return;
  img.dataset.chromaReady = '1';
  var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
  function process() {
    canvas.width = img.naturalWidth || img.width; canvas.height = img.naturalHeight || img.height;
    if (!canvas.width || !canvas.height) return;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    var data = ctx.getImageData(0,0,canvas.width,canvas.height), px = data.data;
    for (var i=0; i<px.length; i+=4) { var r=px[i], g=px[i+1], b=px[i+2]; if (g > r*1.22 && g > b*1.2 && g > 100) { var alpha = Math.max(0, Math.min(255, (Math.max(r,b)-g+95)*3)); px[i+3] = Math.min(px[i+3], alpha); } }
    ctx.putImageData(data,0,0); img.src = canvas.toDataURL('image/png');
  }
  if (img.complete) process(); else img.addEventListener('load', process, {once:true});
}

function preparePixelImages() { document.querySelectorAll('img.chroma-image').forEach(removeGreenBackground); }

}
